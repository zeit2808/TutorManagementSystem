name: tutor-management

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutor_management}
      POSTGRES_USER: ${POSTGRES_USER:-tutor_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - tutor_management_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrator:
    build:
      context: .
      dockerfile: src/Hosts/TutorManagement.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tutor_management};Username=${POSTGRES_USER:-tutor_app};Password=${POSTGRES_PASSWORD:-local-development-only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Hosts/TutorManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tutor_management};Username=${POSTGRES_USER:-tutor_app};Password=${POSTGRES_PASSWORD:-local-development-only}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db-migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: src/Hosts/TutorManagement.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tutor_management};Username=${POSTGRES_USER:-tutor_app};Password=${POSTGRES_PASSWORD:-local-development-only}
    depends_on:
      db-migrator:
        condition: service_completed_successfully

volumes:
  tutor_management_postgres:
